<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dani & Rafa ❤️</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

:root{
    --gold:#D4B483;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #faf7f2,
        #f5eee3,
        #efe5d7,
        #faf7f2
    );

    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
}

@keyframes bgMove{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* Luz dinámica */

.light{
    position:fixed;
    width:500px;
    height:500px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(212,180,131,.18),
        transparent 70%
    );

    pointer-events:none;
    transform:translate(-50%,-50%);
    z-index:1;
}

/* Título */

.title{

    letter-spacing:.25em;

    text-shadow:
    0 5px 30px rgba(212,180,131,.25);

}

/* Carrusel */

.carousel-container{

    perspective:2500px;

}

.carousel3d{

    position:relative;

    width:100%;
    height:72svh;

    transform-style:preserve-3d;

}

.slide{

    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
    object-position:center center;

    border-radius:35px;

    filter:
        brightness(1.08)
        contrast(1.05)
        saturate(1.15)
        sepia(.08);

    transition:
        transform .9s ease,
        opacity .9s ease,
        filter .9s ease;

    box-shadow:
        0 30px 120px rgba(0,0,0,.12);

}

.slide.active{

    opacity:1;

    z-index:5;

    transform:
        translateZ(0)
        scale(1);

}

.slide.left{

    opacity:.35;

    transform:
        translateX(-35%)
        rotateY(35deg)
        scale(.82)
        translateZ(-150px);

    filter:blur(2px);

}

.slide.right{

    opacity:.35;

    transform:
        translateX(35%)
        rotateY(-35deg)
        scale(.82)
        translateZ(-150px);

    filter:blur(2px);

}

/* Capa romántica */

.photo-overlay{

    position:absolute;

    inset:0;

    border-radius:35px;

    background:
    linear-gradient(
        to top,
        rgba(0,0,0,.15),
        transparent 35%,
        transparent 65%,
        rgba(255,240,210,.18)
    );

    pointer-events:none;

}

/* Brillo */

.shine{

    position:absolute;
    inset:0;

    border-radius:35px;

    overflow:hidden;

    pointer-events:none;

}

.shine::before{

    content:"";

    position:absolute;

    top:0;
    left:-150%;

    height:100%;
    width:40%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.25),
        transparent
    );

    animation:shine 8s linear infinite;

}

@keyframes shine{

    from{
        left:-150%;
    }

    to{
        left:180%;
    }
}

/* Botones */

.control{

    background:
    rgba(255,255,255,.6);

    backdrop-filter:blur(20px);

    border:
    1px solid rgba(255,255,255,.4);

}

/* Móvil */

@media(max-width:768px){

    .carousel3d{
        height:68svh;
    }

    .slide.left{

        transform:
            translateX(-20%)
            rotateY(18deg)
            scale(.85);

    }

    .slide.right{

        transform:
            translateX(20%)
            rotateY(-18deg)
            scale(.85);

    }

    .light{
        width:220px;
        height:220px;
    }

}

</style>
</head>

<body>

<div class="light" id="light"></div>

<div class="relative z-10 h-screen flex flex-col">

    <div class="pt-8 md:pt-12">

        <h1 class="title text-center text-4xl md:text-8xl font-extralight text-slate-800">
            DANI
            <span class="text-[#D4B483]">&</span>
            RAFA
        </h1>

    </div>

    <div class="flex-1 flex items-center justify-center px-3 md:px-10">

        <div class="carousel-container w-full max-w-7xl">

            <div id="carousel3d" class="carousel3d">

                <div class="photo-overlay"></div>
                <div class="shine"></div>

            </div>

            <div class="flex justify-center gap-4 mt-6">

                <button
                    onclick="prevImage()"
                    class="control w-12 h-12 rounded-full text-2xl text-[#D4B483]">

                    ‹

                </button>

                <button
                    onclick="nextImage()"
                    class="control w-12 h-12 rounded-full text-2xl text-[#D4B483]">

                    ›

                </button>

            </div>

        </div>

    </div>

</div>

<script>

// CUÁNTAS FOTOS TIENES
const TOTAL_FOTOS = 22;

const carousel = document.getElementById("carousel3d");

// Generar imágenes automáticamente
for(let i=1;i<=TOTAL_FOTOS;i++){

    const img = document.createElement("img");

    img.src = `src/img/${i}.jpeg`;

    img.className = "slide";

    img.draggable = false;

    carousel.prepend(img);

}

const slides = document.querySelectorAll(".slide");

let current = 0;

function renderCarousel(){

    slides.forEach(slide=>{
        slide.className="slide";
    });

    slides[current].classList.add("active");

    slides[
        (current - 1 + slides.length) % slides.length
    ].classList.add("left");

    slides[
        (current + 1) % slides.length
    ].classList.add("right");
}

function nextImage(){

    current =
    (current + 1) % slides.length;

    renderCarousel();

}

function prevImage(){

    current =
    (current - 1 + slides.length) %
    slides.length;

    renderCarousel();

}

renderCarousel();

setInterval(nextImage, 4500);

// Luz dinámica
const light =
document.getElementById("light");

document.addEventListener(
    "mousemove",
    e=>{
        light.style.left =
        e.clientX + "px";

        light.style.top =
        e.clientY + "px";
    }
);

document.addEventListener(
    "touchmove",
    e=>{

        const t = e.touches[0];

        light.style.left =
        t.clientX + "px";

        light.style.top =
        t.clientY + "px";
    }
);

</script>

</body>
</html>
